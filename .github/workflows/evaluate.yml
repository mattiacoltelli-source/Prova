name: Valuta previsioni scadute

on:
  schedule:
    # Primo tick alle 20:15 UTC, 15 minuti dopo la chiusura di NYSE/NASDAQ
    # (16:00 ET = 20:00 UTC in EDT, ora legale USA attiva da marzo a
    # novembre) — così la valutazione delle previsioni scadute quel giorno
    # avviene la sera stessa invece che aspettare fino a notte, come
    # richiesto dall'utente. Corrisponde alle 22:15 in Italia sia in CEST
    # che in CET (l'offset ET-Italia resta di 6 ore quando entrambi i
    # regimi di ora legale sono allineati); nelle settimane in cui USA e
    # Italia non hanno ancora fatto entrambe il cambio, o quando lo
    # scheduled tick di GitHub Actions arriva in ritardo, il secondo tick
    # (03:35 UTC) recupera comunque — evaluate_run.py è idempotente
    # (rilegge data/pending.json ad ogni run e valuta solo ciò che non è
    # ancora stato tolto da lì), quindi un tick troppo presto o un secondo
    # tick che non trova nulla di nuovo sono entrambi no-op gratuiti.
    - cron: "15 20 * * *"
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegue la valutazione senza scrivere su data/ (test sicuro)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: evaluate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Determina modalità run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Valuta previsioni scadute e rigenera il report
        run: |
          ARGS=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m src.evaluate_run $ARGS

      # Retry con rebase su push rifiutato: vedi lo stesso commento in
      # predict.yml — predict.yml/evaluate.yml/snapshot.yml scrivono su
      # data/ in modo indipendente e senza retry un push respinto per un
      # run concorrente andava perso silenziosamente.
      - name: Commit e push
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "predictive-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ REPORT.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Valutazione automatica $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (probabile push concorrente di un altro workflow), tentativo $i/5: fetch + rebase e riprovo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "::error::Rebase fallito: conflitto reale con un commit concorrente, serve intervento manuale."
              git rebase --abort
              exit 1
            fi
            sleep $((i * 3))
          done
          echo "::error::Push fallito dopo 5 tentativi di rebase."
          exit 1

      # Vedi lo stesso step in predict.yml per la logica completa.
      - name: Notifica Telegram in caso di fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'⚠️ <b>Valuta previsioni scadute fallito</b>\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
