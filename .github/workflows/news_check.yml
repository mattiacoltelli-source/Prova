name: Controllo news ad-hoc

# Solo manuale: verifica la cascata Finnhub -> Alpha Vantage -> GDELT per i
# ticker indicati, senza aspettare il prossimo slot di predict.yml. Utile
# dopo aver aggiornato una chiave API, per confermare subito che funzioni.
# Nessuna scrittura su data/, nessuno schedule: gira solo su richiesta.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker separati da virgola, es. NVDA,MSFT,AAPL,AMD"
        type: string
        required: true
        default: "NVDA,MSFT,AAPL,AMD"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # TICKERS passa per una variabile d'ambiente, non interpolato
      # direttamente nello script (anche tra virgolette): l'interpolazione
      # ${{ inputs.tickers }} avviene PRIMA che bash legga lo script, quindi
      # un valore con una virgoletta dentro uscirebbe comunque dalle
      # virgolette e inietterebbe comandi — bug reale di sicurezza trovato
      # il 2026-10-31 (audit), stesso fix raccomandato da GitHub per questa
      # classe di problema.
      - name: Controlla news
        env:
          TICKERS: ${{ inputs.tickers }}
        run: python -m src.news_check_run --tickers "$TICKERS"
