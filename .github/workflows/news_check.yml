name: Controllo news ad-hoc

# Solo manuale: verifica la cascata Finnhub -> Alpha Vantage -> GDELT per i
# ticker indicati, senza aspettare il prossimo slot di predict.yml. Utile
# dopo aver aggiornato una chiave API, per confermare subito che funzioni.
# Nessuna scrittura su data/, nessuno schedule: gira solo su richiesta.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker separati da virgola, es. NVDA,MSFT,AAPL,AMD"
        type: string
        required: true
        default: "NVDA,MSFT,AAPL,AMD"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Controlla news
        run: python -m src.news_check_run --tickers "${{ inputs.tickers }}"
