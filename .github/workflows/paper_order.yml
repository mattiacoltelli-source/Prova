name: Ordine paper trading (Alpaca)

# Solo manuale, sempre: nessuno schedule. Ogni ordine è l'utente che lo
# scrive negli input qui sotto e preme "Run workflow" — è il sì esplicito
# richiesto prima di qualunque ordine (vedi src/paper_trading.py). Punta
# sempre al conto paper di Alpaca (ALPACA_PAPER_BASE_URL fissato nel
# codice, non configurabile da qui): nessun input di questo workflow può
# fargli toccare un conto vero.
#
# dry_run default true, al contrario di predict.yml (dove default è
# false): qui un default "sicuro" significa non piazzare nulla finché non
# lo si disattiva esplicitamente, perché "Run workflow" coi parametri
# sbagliati per sbaglio è un errore molto più facile da fare su un ordine
# che su una previsione.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker azionario (es. NVDA) o coppia crypto (es. BTC/USD)"
        type: string
        required: true
      side:
        description: "Compra o vendi"
        type: choice
        options: ["buy", "sell"]
        required: true
      qty:
        description: "Numero di azioni (lascia vuoto se usi 'notional')"
        type: string
        default: ""
      notional:
        description: "Importo in $ invece delle azioni (lascia vuoto se usi 'qty')"
        type: string
        default: ""
      order_type:
        description: "Tipo di ordine"
        type: choice
        options: ["market", "limit"]
        default: "market"
      limit_price:
        description: "Prezzo limite (solo se order_type=limit)"
        type: string
        default: ""
      time_in_force:
        description: "Validità ordine (crypto: solo gtc o ioc, mai day)"
        type: choice
        options: ["day", "gtc", "ioc"]
        default: "day"
      dry_run:
        description: "Mostra l'ordine senza inviarlo (test sicuro)"
        type: boolean
        default: true

permissions:
  contents: write

# Senza questo blocco, due "Run workflow" quasi in parallelo potrebbero
# entrambi fare checkout prima che il primo pushi il proprio ordine: ogni
# run calcola prev_hash/record_hash (src/storage.py: append_record) sulla
# base dell'ULTIMA riga del file COME LA VEDE IN LOCALE, prima del commit.
# Il retry fetch+rebase nello step "Commit e push" risolve solo il
# conflitto git (il rebase applica comunque la riga in append), ma non
# ricalcola l'hash: il secondo ordine finirebbe pushato con un prev_hash
# che punta alla riga sbagliata (quella di prima del primo ordine, non
# quella appena arrivata), rompendo la catena verificata da
# storage.verify_chain() — corruzione silenziosa, scoperta solo
# nell'audit del 2026-10-31, mai capitata dal vivo. group senza
# cancel-in-progress: la seconda run resta in coda e parte (checkout
# compreso) solo dopo che la prima ha finito, azzerando la finestra di
# race invece di limitarsi a ridurla.
concurrency:
  group: paper-order
  cancel-in-progress: false

jobs:
  order:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # inputs.dry_run è dichiarato type: boolean: usato direttamente in un
      # if: a livello YAML (sotto, nello step di commit) GitHub Actions lo
      # confronta con la stringa 'true' facendo una coercizione di tipo che
      # lo rende SEMPRE vero (visto dal vivo: un run con dry_run=true ha
      # comunque fatto partire "Commit e push", fallito solo perché
      # data/paper/ non esisteva — stesso bug di tipo già risolto allo
      # stesso modo in predict.yml). Normalizzato qui in un output di step,
      # stringa shell confrontata con = fin dall'inizio, mai più un booleano
      # nativo nei passaggi successivi.
      - name: Determina parametri run
        id: mode
        run: echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"

      # symbol/qty/notional/limit_price sono input a testo libero
      # (type: string, compilati a mano nel form "Run workflow"): passano
      # per variabili d'ambiente, mai interpolati direttamente nello script
      # — ${{ inputs.X }} viene sostituito PRIMA che bash legga lo script,
      # quindi un valore con dentro uno spazio o una virgoletta potrebbe
      # iniettare comandi arbitrari nel runner (che ha le chiavi Alpaca in
      # ambiente). Bug reale di sicurezza trovato il 2026-10-31 (audit),
      # fix raccomandato da GitHub per questa classe di problema. L'array
      # bash (non una stringa con "$ARGS" senza virgolette) evita anche un
      # bug più innocuo ma reale: un prezzo o un notional scritto con le
      # virgole al posto del punto si sarebbe spezzato in due argomenti.
      - name: Invia ordine paper
        env:
          SYMBOL: ${{ inputs.symbol }}
          SIDE: ${{ inputs.side }}
          ORDER_TYPE: ${{ inputs.order_type }}
          QTY: ${{ inputs.qty }}
          NOTIONAL: ${{ inputs.notional }}
          LIMIT_PRICE: ${{ inputs.limit_price }}
          TIME_IN_FORCE: ${{ inputs.time_in_force }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          ARGS=(--symbol "$SYMBOL" --side "$SIDE" --order-type "$ORDER_TYPE")
          if [ -n "$QTY" ]; then ARGS+=(--qty "$QTY"); fi
          if [ -n "$NOTIONAL" ]; then ARGS+=(--notional "$NOTIONAL"); fi
          if [ -n "$LIMIT_PRICE" ]; then ARGS+=(--limit-price "$LIMIT_PRICE"); fi
          ARGS+=(--time-in-force "$TIME_IN_FORCE")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m src.paper_order_run "${ARGS[@]}"

      # Stesso pattern di retry-con-rebase di predict.yml/evaluate.yml:
      # tocca un path diverso (data/paper/) quindi un conflitto reale con
      # quei due workflow è comunque impossibile. Un secondo run manuale di
      # QUESTO stesso workflow non può più arrivare in parallelo (vedi il
      # blocco concurrency sopra); questo retry resta solo per un push
      # concorrente da un'altra fonte (es. un commit manuale sullo stesso
      # path).
      - name: Commit e push
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "predictive-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/paper/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Ordine paper trading $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato, tentativo $i/5: fetch + rebase e riprovo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "::error::Rebase fallito: conflitto reale, serve intervento manuale."
              git rebase --abort
              exit 1
            fi
            sleep $((i * 3))
          done
          echo "::error::Push fallito dopo 5 tentativi di rebase."
          exit 1

      - name: Notifica Telegram in caso di fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'\xe2\x9a\xa0\xef\xb8\x8f <b>Ordine paper trading fallito</b>\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
