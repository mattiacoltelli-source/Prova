name: Genera previsioni

on:
  schedule:
    # Un solo slot di previsione al giorno (src/config.py: PREDICTION_SLOTS_ET
    # = 16:30 ET, dopo la chiusura). Finestra 19-23 UTC copre lo slot dovuto
    # (20:30 UTC in EDT, 21:30 UTC in EST) più il margine di recupero di 8 ore
    # (SLOT_CATCHUP_MINUTES) in entrambi i regimi di ora legale/solare
    # statunitense.
    #
    # Due cron separati, sfalsati di 30 minuti (:05 e :35), invece di uno
    # solo: il 2026-09-02 nessuno dei 5 tick di un singolo cron è scattato
    # per l'intera giornata (bug/rallentamento della piattaforma GitHub
    # Actions, non del codice) e la previsione è dovuta partire a mano.
    # predict_run.py è già idempotente per il giorno (_done_slots): un
    # secondo tick che trova lo slot già fatto esce subito gratis
    # ("Nessuno slot dovuto"), quindi raddoppiare i tentativi non ha
    # controindicazioni, solo più occasioni indipendenti perché GitHub
    # riesca a farne partire almeno uno.
    - cron: "5 19-23 * * 1-5"
    - cron: "35 19-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegue la pipeline senza scrivere su data/ (test sicuro)"
        type: boolean
        default: true
      force:
        description: "Ignora il controllo dello slot orario (utile per test manuali)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: predict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Determina modalità run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ github.event.inputs.force }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera previsioni
        run: |
          ARGS=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ steps.mode.outputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m src.predict_run $ARGS

      - name: Commit e push
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "predictive-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Previsioni automatiche $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # Solo su un fallimento vero (es. "Genera previsioni" è uscito con
      # errore non gestito) — mai per gli skip normali per singolo
      # asset/orizzonte (dati mancanti, budget esaurito), quelli sono già
      # attesi e loggati da predict_run.py senza far fallire il job.
      # Nessun secret configurato = notifica saltata silenziosamente, il
      # job non fallisce per questo (stesso pattern già usato in
      # mattiacoltelli-source/qa-agent per Controllo Completo).
      - name: Notifica Telegram in caso di fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'⚠️ <b>Genera previsioni fallito</b>\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
