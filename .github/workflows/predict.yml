name: Genera previsioni

on:
  schedule:
    # Un solo slot di previsione al giorno (src/config.py: PREDICTION_SLOTS_ET
    # = 7:00 ET, prima dell'apertura). Finestra 11-14 UTC copre lo slot dovuto
    # (11:00 UTC in EDT, 12:00 UTC in EST) più il margine di recupero di 145
    # minuti (SLOT_CATCHUP_MINUTES) in entrambi i regimi di ora legale/solare
    # statunitense — volutamente corta, non oltre l'apertura delle 9:30 ET
    # (13:30 UTC in EDT, 14:30 UTC in EST): dopo l'apertura il prezzo non è
    # più quello congelato su cui si basa il calcolo di target_at (vedi
    # predict_run.py: _target_anchor_date()).
    #
    # Tick sfalsati di 20 minuti (:05, :25, :45) invece di uno solo: il
    # 2026-09-02 nessuno dei tick di un singolo cron è scattato per l'intera
    # giornata (bug/rallentamento della piattaforma GitHub Actions, non del
    # codice) e la previsione è dovuta partire a mano. predict_run.py è già
    # idempotente per il giorno (_done_slots): un tick che trova lo slot già
    # fatto (o non ancora dovuto, o la finestra già chiusa) esce subito
    # gratis ("Nessuno slot dovuto"), quindi più tentativi non hanno
    # controindicazioni — solo più occasioni indipendenti perché GitHub
    # riesca a farne partire almeno uno entro la finestra.
    - cron: "5,25,45 11-14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Esegue la pipeline senza scrivere su data/ (test sicuro)"
        type: boolean
        default: true
      force:
        description: "Ignora il controllo dello slot orario (utile per test manuali)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: predict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Determina modalità run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ github.event.inputs.force }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera previsioni
        run: |
          ARGS=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ steps.mode.outputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m src.predict_run $ARGS

      # Retry con rebase su push rifiutato: predict.yml, evaluate.yml e
      # snapshot.yml scrivono tutti su data/ in modo indipendente (proprio
      # gruppo di concorrenza ciascuno, non si bloccano a vicenda), quindi
      # due run di workflow diversi possono finire quasi insieme — il
      # secondo push, senza retry, veniva respinto (remote non fast-forward)
      # e quel run andava perso silenziosamente, con solo l'alert Telegram
      # del job fallito ad accorgersene. Il rebase è sicuro qui: ogni
      # workflow tocca file distinti (predictions.jsonl, pending.json,
      # data/_state/*), un vero conflitto di riga è il caso raro, non quello
      # atteso.
      - name: Commit e push
        if: steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "predictive-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git commit -m "Previsioni automatiche $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rifiutato (probabile push concorrente di un altro workflow), tentativo $i/5: fetch + rebase e riprovo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "::error::Rebase fallito: conflitto reale con un commit concorrente, serve intervento manuale."
              git rebase --abort
              exit 1
            fi
            sleep $((i * 3))
          done
          echo "::error::Push fallito dopo 5 tentativi di rebase."
          exit 1

      # Solo su un fallimento vero (es. "Genera previsioni" è uscito con
      # errore non gestito) — mai per gli skip normali per singolo
      # asset/orizzonte (dati mancanti, budget esaurito), quelli sono già
      # attesi e loggati da predict_run.py senza far fallire il job.
      # Nessun secret configurato = notifica saltata silenziosamente, il
      # job non fallisce per questo (stesso pattern già usato in
      # mattiacoltelli-source/qa-agent per Controllo Completo).
      - name: Notifica Telegram in caso di fallimento
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non configurati nei secret del repo: notifica saltata."
            exit 0
          fi
          MESSAGE=$'⚠️ <b>Genera previsioni fallito</b>\nRun: '"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
