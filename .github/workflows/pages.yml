name: Pubblica GitHub Pages

# Il trigger push (sotto) NON si attiva per i commit automatici di
# predict.yml/evaluate.yml ("Previsioni automatiche", "Valutazione
# automatica"): quei workflow pushano con il GITHUB_TOKEN interno, e
# GitHub non fa scattare altri workflow basati su push per eventi
# generati da quel token (protezione anti-loop). Risultato: senza il
# trigger workflow_run qui sotto, il sito non si è mai aggiornato da solo
# dopo una previsione/valutazione reale, solo dopo un push manuale — bug
# presente fin dalla creazione di questo file, scoperto perché oggi la
# dashboard non mostrava le previsioni appena generate.
#
# workflow_run si basa sul completamento del workflow (qualunque token
# l'abbia fatto scrivere), quindi non ha questo problema. Copre predict.yml,
# evaluate.yml e snapshot.yml — tutti e tre possono cambiare data/.
#
# BUG SCOPERTO IL 2026-09-02 (dashboard senza le previsioni del giorno
# nonostante un "Genera previsioni" concluso con successo poco prima):
# `github.event.workflow_run.head_sha` NON è il commit che predict.yml/
# evaluate.yml hanno scritto e pushato durante la propria esecuzione — è
# lo SHA su cui quel workflow è PARTITO, cioè il commit precedente. Usarlo
# come `ref` qui sotto faceva quindi checkout del codice di PRIMA della
# previsione: rsync non trovava differenze e "Commit e push su gh-pages"
# stampava "Nessuna modifica da pubblicare", sempre, silenziosamente. Il
# job risultava comunque "success" perché nessuno step falliva davvero.
# Fix: su workflow_run si fa checkout del BRANCH (`head_branch`, cioè
# `Main`) invece dello SHA congelato — quando questo job parte, il
# workflow a monte ha già finito di pushare, quindi il branch è già
# aggiornato.
on:
  push:
    branches: [Main]
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "data/**"
      - "REPORT.md"
  workflow_run:
    workflows: ["Genera previsioni", "Valuta previsioni scadute", "Istantanea prezzi"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Con workflow_run, procedi solo se il run che ha attivato l'evento è
    # riuscito (o è stato saltato, es. "nessuno slot dovuto" — non un
    # fallimento) — mai pubblicare a valle di un run fallito. Sugli altri
    # trigger (push, workflow_dispatch) non c'è un workflow_run da
    # controllare, quindi si procede sempre.
    if: >
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["success", "skipped"]'), github.event.workflow_run.conclusion)
    steps:
      - uses: actions/checkout@v5
        with:
          # Su workflow_run: head_branch (non head_sha, vedi commento
          # sopra) — è già aggiornato al commit appena pushato dal
          # workflow a monte. Su push/workflow_dispatch: github.sha va
          # bene, è già il commit esatto dell'evento.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}
          path: main

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      # --checksum (non solo dimensione+mtime, il controllo "quick check"
      # di default di rsync): senza, un aggiornamento di snapshot.json che
      # cambia il contenuto ma non la lunghezza in byte (es. "510.73" ->
      # "510.12", stessa dimensione, entrambi i checkout ravvicinati nello
      # stesso job con mtime quasi identico) viene scambiato per "invariato"
      # e NON copiato — bug reale scoperto il 2026-09-03: un run di
      # snapshot.yml aveva aggiornato tutti e 3 gli asset su Main, ma
      # rsync aveva pubblicato su gh-pages solo NVDA (unico con una
      # dimensione file diversa dal prezzo precedente), lasciando MSFT e
      # AAPL silenziosamente fermi a un'istantanea di ~4 ore prima.
      - name: Sincronizza i file del sito statico su gh-pages
        run: |
          rsync -a --checksum --delete \
            main/index.html main/manifest.json main/sw.js main/REPORT.md \
            pages/
          rsync -a --checksum --delete main/data/ pages/data/

      - name: Commit e push su gh-pages
        run: |
          DEPLOYED_SHA="$(git -C main rev-parse HEAD)"
          cd pages
          git config user.name "predictive-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "deploy: $DEPLOYED_SHA"
            git push
          fi
