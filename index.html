<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Predictor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-icon">📈</div>
      <h1>AI Predictor</h1>
    </div>
    <button class="btn-refresh" id="refreshBtn">🔄 Aggiorna</button>
  </header>

  <div class="overview-card">
    <div class="stat-item">
      <span class="stat-label">ACCURATEZZA AI</span>
      <span class="stat-value green" id="globalAccuracy">0.0%</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">VALUTATI</span>
      <span class="stat-value" id="totalEvaluated">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">IN ATTESA</span>
      <span class="stat-value" id="totalPending">0</span>
    </div>
  </div>

  <div class="action-grid">
    <button class="action-btn" id="newPredBtn">⚡ Nuova Predizione</button>
    <button class="action-btn" id="evaluateBtn">🎯 Valuta Risultati</button>
  </div>

  <div class="asset-section">
    <div class="asset-header">
      <div class="asset-tabs">
        <button class="tab-btn active" data-asset="SPY">SPY</button>
        <button class="tab-btn" data-asset="AAPL">AAPL</button>
      </div>
      <span class="asset-accuracy-badge" id="assetAccuracy">Accuratezza: 0.0%</span>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot blue"></span> Prezzo Iniziale</div>
      <div class="legend-item"><span class="legend-dot green"></span> Prezzo Target Reale</div>
    </div>

    <div class="chart-container" id="chartContainer">
      <svg class="chart-svg" viewBox="0 0 300 150" id="chartSvg">
        <text x="150" y="75" fill="#94a3b8" font-size="12" text-anchor="middle">Caricamento dati grafico...</text>
      </svg>
    </div>
  </div>

  <div class="section-title">Ultimi Risultati Valutati</div>
  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Orizzonte</th>
          <th>Preditto</th>
          <th>Reale</th>
          <th>Esito</th>
        </tr>
      </thead>
      <tbody id="evaluatedTableBody">
        <tr>
          <td colspan="5" class="empty-msg">Nessuna valutazione ancora.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="section-title">Ultimi Segnali Generati</div>
  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Orizzonte</th>
          <th>Classe</th>
          <th>Conf.</th>
        </tr>
      </thead>
      <tbody id="predictionsTableBody">
        <tr>
          <td colspan="4" class="empty-msg">Nessuna predizione registrata.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
